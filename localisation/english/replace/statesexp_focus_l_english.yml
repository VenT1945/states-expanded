 SYR_general_strike: "Call for a General Strike"
 SYR_general_strike_desc: "The people of Syria are demanding an end to the oppression of the French mandate, and widespread unrest has erupted throughout the country. A general strike is taking shape as workers, merchants, and civil servants refuse to cooperate with mandate authorities. The National Bloc must now decide whether to endorse the movement or caution against its consequences."
 SYR_limit_french_control: "Limit French Control"
 SYR_limit_french_control_desc: "French officials still hold the majority of the real authority in Syria, even as pressure for independence continues to grow. The National Bloc is trying to chip away at that control where it can. It is a careful balancing act between asserting Syrian authority and avoiding a crackdown that could set the movement back years."
 SYR_expand_ministry_of_interior: "Expand the Ministry of the Interior"
 SYR_expand_ministry_of_interior_desc: "As unrest grows and French authority weakens, the Syrian administration seeks to strengthen its own internal structures. Expanding the Ministry of Interior would improve coordination across provinces and give Damascus greater control over policing and civil administration."
 SYR_remembering_great_syrian_revolt: "Remembering the Great Syrian Revolt"
 SYR_remembering_great_syrian_revolt_desc: "Commemorating the Great Syrian Revolt reinforces the legacy of resistance against foreign rule. Public ceremonies and speeches help strengthen national unity and increase support for the National Bloc's cause."
 SYR_defense_act: "Ratify the Defense Act"
 SYR_defense_act_desc: "The question of Syria's defense forces has become increasingly urgent as instability spreads and French authority weakens. Ratifying a Defense Act would formalize recruitment, funding, and organization of local forces under Syrian oversight. It is a step toward autonomy, but one that risks provoking a strong reaction from the mandate authorities."
 SYR_syrian_question: "The Syrian Question"
 SYR_syrian_question_desc: "Syria's future status is being debated both domestically and on the international stage, with competing visions of independence or continued mandate oversight. How the “Syrian Question” is resolved will define the country's political direction for years to come."
 SYR_ban_ssnp: "Crackdown on the SSNP Party"
 SYR_ban_ssnp_desc: "The Syrian Social Nationalist Party has drawn concern from authorities due to its radical ideology and increasingly organized political presence. Outlawing the movement would reduce its ability to operate openly and limit its influence in public life. However, such a move risks driving its supporters underground and increasing political tensions."
 SYR_allow_ssnp: "Allow SSNP Operations"
 SYR_allow_ssnp_desc: "The Syrian Social Nationalist Party continues to attract followers, particularly among certain urban and intellectual groups. Allowing it to operate legally could help channel its support into formal political processes rather than underground activity. This tolerance, however, may also encourage ideological rivalry and a more fragmented political landscape."
