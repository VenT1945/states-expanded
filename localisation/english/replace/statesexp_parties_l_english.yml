l_english:
 phalangism:0 "Phalangism"
 phalangism_desc:0 "Phalangism is an authoritarian nationalist ideology rooted in Lebanese nationalism and Christian identity. Phalangism emphasizes a strong centralized state, anti-communism, social conservatism, and the defense of Lebanon's independence and confessional order."
 monarchism:0 "Monarchist"
 monarchism_noun:0 "Monarchism"
 monarchism_desc:0 "Monarchist State"
 constitutional_monarchy:0 "Constitutional Monarchy"
 constitutional_monarchy_desc:0 "Constitutional Monarchy is a form of monarchy in which a monarch rules according to a constitution, sharing authority with an elected government."
 absolutism:0 "Absolute Monarchy"
 absolutism_desc:0 "Absolute Monarchy is a form of monarchy in which a single monarch rules with absolute power."
 traditional_monarchy:0 "Traditional Monarchy"
 traditional_monarchy_desc:0 "Traditional Monarchy is a form of monarchy in which a monarch shares authority with nobles or local lords."
 theocratic_monarchy:1 "Theocratic Monarchy"
 theocratic_monarchy_desc:1 "Theocratic Monarchy is a form of monarchy in which a monarch rules with absolute power, whereas authority is derived from divine right or religious law."
 dynastic_monarchy:1 "Dynastic Rule"
 dynastic_monarchy_desc:1 "Dynastic Rule is a form of monarchy in which a family rules with absolute power, whereas authority is derived from lineage and succession."
 emirate:0 "Emirate"
 emirate_desc:0 "An Emirate is a form of monarchy, typically located in the Middle East or North Africa, in which an emir rules with absolute power."
 sultanate:0 "Sultanate"
 sultanate_desc:0 "A Sultanate is a form of monarchy, typically located in the Islamic World, in which a Muslim sultunate rules with absolute power."
 hashemite_monarchy:0 "Hashemite Dynasty"
 hashemite_monarchy_desc:0 "The Hashemite Dynasty is a dynasty located in the Levant, which has historic connections to Jordan, Iraq, Syria, and Hejaz."

