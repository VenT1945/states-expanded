l_english:
 LON_mandate_A: "League of Nations Class A Mandate"
 LON_mandate_A_desc: "After the collapse of the Ottoman Empire, the League of Nations created Class A mandates in former Ottoman territory in the Middle East. These mandates are territories nearly capable of self-governance, but require administration from a world power for the time being."
 PAL_marginalized_muslim_maj: "Marginalized Muslim Majority"
 PAL_marginalized_muslim_maj_desc: "The Muslim majority in Palestine is not sufficiently represented by the current government, fueling resentment and unrest."
 PAL_balfour_declaration: "The Balfour Declaration"
 PAL_balfour_declaration_desc: "The Balfour Declaration was a public statement issued by the British government in 1917 that supported the creation of a Jewish homeland in Palestine. This in turn causes greater Jewish and Zionist immigration into Palestine, but also opposition from Arabs."
 LON_colonial_economy: "Colonial Economy"
 LON_colonial_economy_desc: "As a colony, our economy has been transformed by our overlord into a resource extraction and exporting system, with almost nothing in return. This is hindering our ability to become self-sufficient."
 ALDR_ineffective_colonial_admin: "Ineffective Colonial Administration"
 ALDR_ineffective_colonial_admin_desc: "The French government maintains only a minimal administrative presence in our state. Viewed as unimportant and unprofitable, we suffer from neglect and a weak, ineffective governance."
 DRU_mountain_hold: "Mountain Hold"
 DRU_mountain_hold_desc: "The Druze have historically lived throughout the mountains of the Levant. We have better knowledge of these lands than our enemies, allowing us to defend ourselves better."
 ALA_weak_united_voice: "Weak United Voice"
 ALA_weak_united_voice_desc: "Even though there is a great desire for separatism in the Alawite population, there is not one unified voice to be heard. It is divided between the upper class in the cities and the peasantry."
 ALA_medium_united_voice: "Moderate United Voice"
 ALA_medium_united_voice_desc: "Divisions within the Alawite community are beginning to diminish, allowing for a stronger independence movement, though significant differences still remain."
 ALA_strong_united_voice: "Strong United Voice"
 ALA_strong_united_voice_desc: "The Alawite community now speak with a unified voice for independence."
 ALDR_weak_army_1: "Weak Army"
 ALDR_weak_army_1_desc: "As a small region with little autonomy and investments, it is inevitable that our army is going to remain weak and undertrained. We need to improve the army urgently before it is put to the test."
 ALDR_weak_army_militia: "Weak Army: Militia Favored"
 ALDR_weak_army_militia_desc: "A slightly improved army than before, but still weak. Instead of producing National Guard divisions, which would take longer, we have decided to produce smaller, but quicker to train, Militia Groups that will overwhelm the enemies."
 ALDR_weak_army_guard: "Weak Army: National Guard Favored"
 ALDR_weak_army_guard_desc: "A slightly improved army than before, but still weak. Instead of mass producing smaller and weaker militia groups, we have decided to produce strong National Guard divisions that will protect us."
 ALDR_trained_army_militia: "Trained Army: Militia Favored"
 ALDR_trained_army_militia_desc: "A newly improved army that focuses on quick and easy to produce militia groups to protect the country."
 ALDR_trained_army_guard: "Trained Army: National Guard Favored"
 ALDR_trained_army_guard_desc: "A newly improved army that focuses on strong and trained National Guards to protect the country."
 ALDR_revive_culture: "The Revival of Culture Law"
 ALDR_revive_culture_desc: "The government has passed a new law that would revive the local culture, distancing ourselves from a united Syrian culture."
 ALDR_cheaper_guns: "Cheaper Guns"
 ALDR_cheaper_guns_desc: "With a decree by the government to make more guns for the army, the factories have gone into overdrive. But with quicker and cheaper production, comes downsides to the reliability of the guns."
 SYR_french_levant_army: "Armée du Levant"
 SYR_french_levant_army_desc: "The Armée du Levant is the armed forces of the French mandates of Syria and Lebanon, ensuring French authority while maintaining order in the region"
 SYR_french_levant_army_tt: "\nThis national spirit will be removed if Syria is no longer a French mandate. In addition, §YCharles Huntziger§! will be removed and sent back to France if he has not been coerced to join the new Syrian state."
 SYR_divide_and_rule: "Divide and Rule"
 SYR_divide_and_rule_desc: "The French mandate lays forth a plan that keeps Syria divided and weak. This is to cement French colonial rule while supressing our desires for freedom. To get rid of this, we will need to annex the break away states."
 SYR_banque_de_syrie_1: "Banque de Syrie et du Grand-Liban"
 SYR_banque_de_syrie_1_desc: "A French bank formed from the defunct Imperial Ottoman Bank, granting a central banking role in the mandates of Syria and Lebanon."
 SYR_banque_de_syrie_2_desc: "A French bank, whose offices and branches in our country have been nationalized by the government, now serves the people and the country more effectively."
 SYR_true_syria_1: "The True Syrian Government"
 SYR_independence: "Independence Gain"
 HAT_peoples_assembly_tt: "\nWhile this national spirit is active, the Hatay Peoples State Assembly decision category will be visible."