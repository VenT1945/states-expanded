 UTA_expansion_north_IRQ: "Expansion into the Neutral Territory"
 UTA_expansion_north_IRQ_desc: "The Neutral Territory of Iraq and Saudi Arabia, created by the Uqair Convention in 1922, is a neutral territory between the South of Iraq and the Northeast of Saudi Arabia. We have decided to spread influence in the area and annex it."

