 syria.1.t: "A Call for a General Strike"
 syria.1.d: "The National Bloc has spent months organizing merchants, laborers, students, and civil servants in preparation for a nationwide general strike. By bringing daily life to a standstill, they hope to demonstrate that the French Mandate cannot endure without the cooperation of the Syrian people.\n\nSupporters believe a peaceful display of national unity will strengthen the movement for independence and rally Syrians behind the National Bloc. Others warn that such a strike could invite harsh reprisals from the French authorities and place a heavy burden on an already fragile economy.\n\nThe organizers now await our decision."
 syria.1.a: "The nation shall stand together."
 syria.1.b: "The risks are too great."
 syria.2.t: "Huntziger Accepts!"
 syria.2.d: "Our efforts have borne fruit. Rather than returning to France, Charles Huntziger has accepted our offer to remain in Syria. Though his decision is certain to raise eyebrows both in Paris and among some of our own officers, his military experience and intimate knowledge of the country will prove invaluable in shaping the future of the Syrian Army."
 syria.2.a: "A valuable addition to our ranks."
 syria.3.t: "No Reply from Huntziger"
 syria.3.d: "Despite repeated attempts to secure his services, Charles Huntziger has yet to give us a definitive answer. With his future still uncertain, all we can do is wait and hope that he ultimately chooses to remain in Syria."
 syria.3.a: "We can only wait."
 syria.4.t: "Huntziger Returns to France"
 syria.4.d: "Charles Huntziger has declined our proposal and departed for France. Whatever attachment he may have formed to Syria, it was ultimately outweighed by his sense of duty to his homeland. We must now look elsewhere for experienced leadership."
 syria.4.a: "So be it."
 charles_huntziger_leaves_tt: "Charles Huntziger leaves for France, and along with his departure, the idea §YArmée du Levant§! will be removed."
