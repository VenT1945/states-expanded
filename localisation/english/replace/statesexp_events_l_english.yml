 syria_national.9.t: "An Invitation from [FROM.GetNameDef]"
 syria_national.9.d: "The government of [FROM.GetNameDef] has proposed the establishment of an Arab League, a new organization intended to strengthen cooperation between the independent Arab states. Through closer diplomatic, economic, and military ties, its supporters hope to promote common interests while preserving the sovereignty of each member.\n\nShould we join this new organization?"
 syria_national.9.a: "Together, we are stronger."
 syria_national.9.b: "We shall remain outside."
 syria_national.10.t: "[FROM.GetNameDefCap] Joins the Arab League"
 syria_national.10.d: "The government of [FROM.GetNameDef] has accepted our invitation and agreed to join the Arab League. With another Arab nation committed to closer cooperation, our vision of regional unity has taken an important step forward."
 syria_national.10.a: "Welcome."
 syria_national.11.t: "[FROM.GetNameDefCap] Declines the Invitation"
 syria_national.11.d: "The government of [FROM.GetNameDef] has declined our invitation to join the Arab League. Whether out of concerns for their sovereignty or differing political priorities, they have chosen to remain outside the organization for the time being."
 syria_national.11.a: "A regrettable decision."
 syria_baath.1.t: "Hashim al-Atassi Resigns!"
 syria_baath.1.d: "Following the unexpected victory of the League of Nationalist Action in the Election of [GetYear], former National Bloc president Hashim al-Atassi has publicly announced his retirement, stating that 'I cannot in good conscience be a politician in a government dominated by radical street agitators who threaten the fragile constitutional order of our new Republic'. Al-Atassi has retreated to a reclusive life in his family home in Homs, severing all political ties. In other news, Shukri al-Quwatli has taken over the leadership of the National Bloc, and the Syrian people are bracing themselves for a turbulant, new chapter of history."
 syria_baath.1.a: "We lost a good one today..."
