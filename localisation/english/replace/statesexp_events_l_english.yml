 syria_ssnp.4.t: "The Purge of the Opposition"
 syria_ssnp.4.d: "With the Revolution secure, the Syrian Social Nationalist Party has begun removing those deemed hostile to the new order. Prominent politicians of the old establishment have been dismissed from office, outspoken critics have quietly disappeared from public life, and officers whose loyalty is in doubt have found themselves replaced by men more sympathetic to the Party. Though little has been announced officially, few in Damascus are willing to ask what has become of those who have vanished.\n\nFor the first time since taking power, the Party's authority appears unquestioned."
 syria_ssnp.4.a: "The Nation must speak with one voice."
