 syria_league.1.t: "The Honeymoon Ends"
 syria_league.1.d: "Only weeks after taking office, the League of Nationalist Action is already discovering the burdens of government. Ministries struggle to coordinate policy, provincial officials complain of contradictory instructions, and parliamentary deputies have begun questioning whether the League possesses the administrative experience required to govern Syria. Though public enthusiasm remains, confidence within the political establishment has noticeably declined."
 syria_league.1.a: "The realities of government are setting in."
 syria_league.2.t: "Cabinet in Deadlock"
 syria_league.2.d: "Disagreements between ministers have become increasingly public. Economic reforms stall in parliament, debates over foreign policy remain unresolved, and government departments hesitate to implement cabinet decisions without clear direction. Newspapers across the country now describe the administration as divided and ineffective, while opposition politicians quietly prepare for the government's collapse."
 syria_league.2.a: "This cannot continue."
 syria_league.3.t: "Confidence Lost"
 syria_league.3.d: "The League government has lost the confidence of much of Syria's political establishment. Senior officials privately discuss forming a replacement ministry, while influential deputies urge President Hashim al-Atassi to intervene before the country's administration deteriorates further. Though no formal action has yet been taken, few now believe the government can survive much longer."
 syria_league.3.a: "Our position has become untenable."
 SYR_can_now_complede_focus_ousting: "The focus §YOusting of the League!§! can now be completed."
 syria_national.1.t: "A National Anthem for Syria"
 syria_national.1.d: "With Syria now charting its own course, the government has sought a national anthem worthy of the Republic. A public competition has attracted many submissions, but two have emerged as clear favorites: one by the statesman and poet Khalil Mardam Bey, the other by the young poet Omar Abu Risha. The winning composition will become a symbol of the nation's identity for years to come."
 syria_national.1.a: "Select Khalil Mardam Bey's composition."
 syria_national.1.b: "Select Omar Abu Risha's composition."
 syria_national.2.t: "The Constitution of the Republic"
 syria_national.2.d: "With independence secured and the National Bloc entrusted with leading the new Republic, the Constituent Assembly has begun drafting Syria's permanent constitution. While all agree that the nation must be governed by its own laws, there is little consensus on how power should be distributed. Some favor a parliament as the supreme authority, others call for a strong presidency capable of decisive leadership, while many advocate a careful balance between the two. The choice made today will define the character of the Syrian Republic."
 syria_national.2.a: "The Parliament shall be supreme."
 syria_national.2.b: "The President must lead the Republic."
 syria_national.2.c: "Power shall be shared equally."
 SYR_on_rpc_completion: "Upon the completion of §YNew Republic, New Constitution§!, the following idea will be added:"
