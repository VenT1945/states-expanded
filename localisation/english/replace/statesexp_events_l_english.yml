 syria_ssnp.11.t: "[FROM.GetNameDefCap] Offers to Purchase Cyprus"
 syria_ssnp.11.d: "The government of [FROM.GetNameDef] has approached us with an unusual proposal: the purchase of Cyprus. Syrian officials argue that the island occupies a natural place within the Eastern Mediterranean and would be better administered from Damascus than from a distant imperial capital. In exchange, they have offered financial compensation and assurances that the transfer would strengthen relations between our two countries.\n\nWhile some dismiss the proposal as little more than nationalist ambition, others question whether Cyprus remains vital to our interests."
 syria_ssnp.11.a: "Accept their offer."
 syria_ssnp.11.b: "Cyprus is not for sale."
 syria_ssnp.12.t: "Cyprus Acquired"
 syria_ssnp.12.d: "Our negotiations have been successful. The government of [FROM.GetNameDef] has agreed to transfer Cyprus to Syrian administration, marking a major diplomatic victory for the Republic. Advocates of the SSNP's vision of Greater Syria have celebrated the agreement as evidence that national objectives can be achieved through diplomacy as well as strength."
 syria_ssnp.12.a: "A triumph for Syria."
 syria_ssnp.13.t: "Our Offer Rejected"
 syria_ssnp.13.d: "The government of [FROM.GetNameDef] has rejected our proposal to purchase Cyprus, insisting that the island will remain under its current administration. The decision has been met with anger among many supporters of the Syrian Social Nationalist Party, who regard Cyprus as a natural part of Greater Syria. Having exhausted diplomatic avenues, some now argue that stronger measures may be required."
 syria_ssnp.13.a: "Then we shall pursue other means."
 syria_ssnp.14.t: "A Proposal from [FROM.GetNameDef]"
 syria_ssnp.14.d: "The government of [FROM.GetNameDef] has proposed to us the Berlin-Damascus Pact, an informal understanding intended to strengthen relations between our two nations. Though falling short of a formal military alliance, the agreement would establish closer diplomatic ties, mutual guarantees, and military cooperation. Supporters argue that cultivating a friendly government in the Levant would advance German interests in the region, while others question the value of committing ourselves to a distant partner."
 syria_ssnp.14.a: "We shall work together."
 syria_ssnp.14.b: "Germany has other priorities."
 syria_ssnp.15.t: "The Berlin-Damascus Pact"
 syria_ssnp.15.d: "The German government has accepted our proposal for the Berlin-Damascus Pact. While not a formal alliance, the agreement establishes a close relationship between our two nations through diplomatic cooperation, military coordination, and mutual guarantees. The SSNP leadership has hailed the pact as an important step toward securing Syria's place in the emerging international order."
 syria_ssnp.15.a: "A promising partnership."
 syria_ssnp.16.t: "Germany Declines"
 syria_ssnp.16.d: "Despite our efforts to establish closer ties, the German government has declined our proposal for the Berlin-Damascus Pact. Whether out of strategic caution or competing priorities elsewhere, Berlin has chosen not to commit itself to closer cooperation with Syria. For now, we must look elsewhere for friends abroad."
 syria_ssnp.16.a: "A disappointing outcome."
