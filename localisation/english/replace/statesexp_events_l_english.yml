 syria.8.t: "The Return of Muhammad al-Ashmar"
 syria.8.d: "After years spent abroad, Muhammad al-Ashmar has returned to Syria. A veteran of the Great Syrian Revolt, he has since become closely associated with socialist and communist circles while continuing to advocate for Arab liberation. Upon his arrival, he has offered his services to the Syrian government. While his revolutionary credentials are beyond dispute, his political views remain deeply divisive."
 syria.8.a: "Welcome him home."
 syria.8.b: "There is no place for such radical politics in Syria."
 syria_news.1.t: "General Strike Paralyzes Syria"
 syria_news.1.d: "A nationwide general strike has brought Syria to a standstill as merchants, workers, and civil servants have answered the call of nationalist leaders. Across the country, businesses have closed and daily life has been disrupted in a show of opposition to the current political order.\n\nWhile supporters hail the strike as a demonstration of Syrian unity, the authorities face growing pressure to respond. The outcome of this movement may determine the future of Syria's struggle for greater autonomy."
 syria_news.1.a: "The world watches."
 syria_news.2.t: "Syria Proclaims Independence"
 syria_news.2.d: "After years of negotiations, unrest, and growing demands for self-rule, Syria has officially declared its independence from the French Mandate. The announcement marks the end of French authority over Syrian affairs and the beginning of a new chapter for the Syrian people.\n\nThe challenges ahead are numerous. A new government must now establish its legitimacy, secure the nation's borders, and prove that Syria can stand on its own without foreign oversight."
 syria_news.2.a: "We are free at last!"
