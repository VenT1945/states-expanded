 syria_elections.1.t: "The First General Election"
 syria_elections.1.d: "With the question of independence finally settled, the Syrian people have been called upon to elect their first government free from French oversight. The National Bloc, long regarded as the architects of independence, promises stability and gradual reform. Challenging them is the League of Nationalist Action, whose younger and more radical members argue that Syria must break with the politics of the past.\n\nThe ballots have been cast. Who shall lead the Republic?"
 syria_elections.1.a: "The National Bloc shall form the government."
 syria_elections.1.b: "The League of Nationalist Action prevails."
 syria_elections.2.t: "A Government in Crisis"
 syria_elections.2.d: "The League of Nationalist Action has lost the confidence of the Syrian people. Political infighting, administrative failures, and growing public dissatisfaction have left the government unable to continue. Once again, Syria finds itself at a crossroads.\n\nThe National Bloc offers a return to experienced leadership, while a new generation of Arab thinkers calls for the revolutionary ideals of Ba'athism."
 syria_elections.2.a: "The National Bloc shall return."
 syria_elections.2.b: "A new philosophy shall guide Syria."
 syria_elections.2.c: "Restore the Hashemite throne."
 syria_treaty.1.t: "The Question of Independence"
 syria_treaty.1.d: "As negotiations with France continue, the Syrian delegation has agreed that certain demands cannot be compromised. Independence remains the foremost objective, while the continued separation of the Alawite and Jabal al-Druze States is regarded by many as an unacceptable remnant of the Mandate. Though securing these concessions may prove difficult, few believe that the Republic can be considered complete without them.\n\nShall these demands be presented to the French delegation?"
 syria_treaty.1.a: "Our position is clear."
 syria_treaty.2.t: "The Lebanese Question"
 syria_treaty.2.d: "The status of Lebanon remains one of the most contentious issues before the negotiating table. While France has long administered Lebanon separately from Syria, many politicians continue to view the two territories as inseparable. Others warn that pressing the issue could jeopardize the negotiations altogether and risk losing more attainable concessions.\n\nShall these demands be presented to the French delegation?"
 syria_treaty.2.a: "Lebanon belongs within our sphere."
 syria_treaty.2.b: "This demand can wait."
 syria_treaty.3.t: "[FROM.GetNameDefCap] Demands Lebanon"
 syria_treaty.3.d: "The delegation representing [FROM.GetNameDef] has formally requested that France permit Lebanon to enter into a protectorate relationship with the Syrian Republic as part of the final settlement. While France may authorize such an arrangement, the Lebanese government will ultimately decide whether to accept the proposal.\n\nApproving this request would mark another major concession in the negotiations, while refusing it would preserve the existing status of Lebanon."
 syria_treaty.3.a: "Accept their proposal."
 syria_treaty.3.b: "Lebanon shall remain outside their control."
 syria_treaty.4.t: "The Future of Franco-Syrian Relations"
 syria_treaty.4.d: "Even if Syria secures its independence, the question of its relationship with France will remain unresolved. Some members of the delegation favor maintaining close diplomatic and military ties, arguing that cooperation will provide stability during the Republic's early years. Others believe that Syria should sever all special relations with its former mandatory power, accepting compensation in exchange for a clean break.\n\nShall these demands be presented to the French delegation?"
 syria_treaty.4.a: "Our nations should part ways."
 syria_treaty.4.b: "Cooperation serves us both."
 syria_treaty.5.t: "[FROM.GetNameDefCap] Seeks a Final Settlement"
 syria_treaty.5.d: "The representatives of [FROM.GetNameDef] have raised the question of future relations between our two nations following the conclusion of the treaty. While they are prepared to accept financial compensation for French investments and obligations, they insist that all privileged diplomatic and military ties between our countries be brought to an end.\n\nRejecting these demands would preserve a close relationship with [FROM.GetNameDef], though doing so may complicate the negotiations."
 syria_treaty.5.a: "Accept their terms."
 syria_treaty.5.b: "Our partnership must continue."
 syria_treaty.6.t: "The Franco-Syrian Treaty"
 syria_treaty.6.d: "Following months of negotiations, the completed treaty with [FROM.GetNameDef] has arrived in Paris for final consideration. The agreement recognizes Syrian independence while settling the outstanding questions raised during the negotiations, marking what could become the end of the French Mandate.\n\nSupporters argue that ratification would preserve French influence through diplomacy rather than direct administration and demonstrate France's commitment to its international obligations. Opponents warn that relinquishing control over Syria would diminish French prestige and encourage nationalist movements throughout the Empire.\n\nThe final decision now rests with the government."
 syria_treaty.6.a: "Ratify the treaty."
 syria_treaty.6.b: "Reject the treaty."
 syria_treaty.7.t: "[FROM.GetNameDefCap] Requests Unification"
 syria_treaty.7.d: "The government of [FROM.GetNameDef] has formally requested our incorporation into the Syrian Republic as part of the ongoing treaty negotiations with France. Supporters argue that the Mandate's autonomous administrations were always intended to be temporary and that reunification would strengthen Syria as an independent nation. Others fear that our people will lose the autonomy they have enjoyed under French rule and insist that our future should remain in our own hands.\n\nThe time has come to determine our course."
 syria_treaty.7.a: "We shall join the Syrian Republic."
 syria_treaty.7.b: "We will preserve our independence."
 syria_treaty.8.t: "[FROM.GetNameDefCap] Rejects Unification"
 syria_treaty.8.d: "Despite our efforts to restore the territorial integrity of Syria, the government of [FROM.GetNameDef] has rejected our proposal for peaceful unification. Citing concerns over local autonomy and self-government, they have declared their intention to remain independent. Diplomatic efforts have reached an impasse, leaving us with few options if we wish to see the Republic united."
 syria_treaty.8.a: "Then we shall settle this by force."
 syria_treaty.9.t: "Our Proposal Accepted"
 syria_treaty.9.d: "[FROM.GetNameDefCap] has agreed to our proposal. Though further negotiations may still lie ahead, another step has been taken toward securing a favorable settlement."
 syria_treaty.9.a: "Excellent."
 syria_treaty.10.t: "Our Proposal Rejected"
 syria_treaty.10.d: "[FROM.GetNameDefCap] has rejected our proposal, refusing to make further concessions on the matter. While negotiations may continue, it is clear that not every demand will be met without resistance."
 syria_treaty.10.a: "Most unfortunate."
 syria_treaty.11.t: "The Treaty Comes into Effect"
 syria_treaty.11.d: "With the treaty now ratified by the French government, the long-awaited transfer of authority has begun. The independence of the Syrian Republic has been formally recognized, while the reintegration of the Alawite and Jabal al-Druze States is now set to proceed in accordance with the agreement. Though the future of these autonomous territories ultimately rests in the hands of their own governments, many hope they will choose to take their place within the Republic.\n\nA new chapter in Syrian history has begun."
 syria_treaty.11.a: "May the Republic prosper."
 syria_treaty.12.t: "A New Beginning"
 syria_treaty.12.d: "The treaty has entered into force, bringing an end to the French Mandate and marking the beginning of a new era for Syria. Though our special relationship with France has come to a close, the agreed financial compensation will provide valuable resources as the Republic establishes its own institutions. At last, Syria stands independent and free to determine its own destiny."
 syria_treaty.12.a: "The future is ours to shape."
 syria_treaty.13.t: "A Partnership Preserved"
 syria_treaty.13.d: "The treaty has secured Syria's independence while preserving close ties with France. Military cooperation, diplomatic agreements, and mutual guarantees will ensure that the two nations remain partners even after the Mandate has come to an end. Though some had hoped for a complete break with our former administrators, many believe this continued friendship will provide stability during the Republic's earliest years."
 syria_treaty.13.a: "A friendship between equals."
 syria_treaty.14.t: "A Syrian Proposal"
 syria_treaty.14.d: "With the Franco-Syrian Treaty now in force, the government of the Syrian Republic has formally invited Lebanon to enter into a protectorate relationship. Supporters argue that close cooperation with Syria would strengthen both nations and preserve stability in the Levant, while opponents fear that such an arrangement would gradually erode Lebanon's autonomy and place its future in Syrian hands.\n\nThe decision now rests with the Lebanese government."
 syria_treaty.14.a: "We shall accept Syria's protection."
 syria_treaty.14.b: "Lebanon must remain independent."
 syria_treaty.15.t: "The Treaty Revoked"
 syria_treaty.15.d: "Despite having previously ratified the Franco-Syrian Treaty, the French government has chosen to revoke its approval. The promises made in Paris have been cast aside, leaving Syria's independence once again subject to the will of the Mandatory Power. Across the country, the decision has been met with disbelief and outrage, reinforcing the conviction of many that France never truly intended to honor its commitments."
 syria_treaty.15.a: "A bitter betrayal."
 syria_treaty.16.t: "The Treaty Ratified"
 syria_treaty.16.d: "Word has arrived from Paris: the French government has voted to ratify the Franco-Syrian Treaty. After years of negotiations and political struggle, France has formally recognized the Syrian Republic and agreed to implement the terms of the agreement. Though much work remains before the transition is complete, the long struggle for independence has finally borne fruit."
 syria_treaty.16.a: "At last."
 syria_treaty.17.t: "The Treaty Rejected"
 syria_treaty.17.d: "The French government has refused to ratify the Franco-Syrian Treaty. Despite months of negotiations and the promises made during the drafting of the agreement, Paris has declined to recognize Syria's demands. The hopes placed in diplomacy have been dealt a severe blow, and many now question whether independence can ever be achieved through negotiation alone."
 syria_treaty.17.a: "Our struggle continues."
 syria_treaty.18.t: "[FROM.GetNameDefCap] Accepts"
 syria_treaty.18.d: "The government of [FROM.GetNameDef] has accepted our proposal and agreed to enter into a protectorate relationship with the Syrian Republic. While retaining a large measure of internal autonomy, the agreement establishes a new political partnership between our two nations. It is hoped that this arrangement will strengthen stability and cooperation throughout the Levant."
 syria_treaty.18.a: "A new chapter begins."
 syria_treaty.19.t: "[FROM.GetNameDefCap] Declines"
 syria_treaty.19.d: "The government of [FROM.GetNameDef] has declined our proposal, choosing instead to preserve its full independence. Though many had hoped for closer political ties, their decision brings the matter to a peaceful conclusion. For now, relations between our two republics will continue as sovereign equals."
 syria_treaty.19.a: "We respect their decision."
 syria_treaty.20.t: "[FROM.GetNameDefCap] Seeks a Treaty"
 syria_treaty.20.d: "The government of [FROM.GetNameDef] has formally requested negotiations over a new Franco-Syrian treaty to settle the future of the Mandate. While the Syrian delegation has made clear that independence is its ultimate objective, the precise terms of any agreement remain to be determined.\n\nOver the coming months, representatives from [FROM.GetNameDef] are expected to present a number of proposals concerning territorial arrangements, future relations between our two nations, and other outstanding issues. It will fall to the French government to determine whether these demands are acceptable."
 syria_treaty.20.a: "Let the negotiations begin."
