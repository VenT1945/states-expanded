l_english:
 SYR_GATHERING_STORM_DESC: "Once a province of the Ottoman Empire, Syria stood at the crossroads of empires. With the Empire's collapse at the end of the Great War, Arab nationalists created the short-lived Arab Kingdom of Syria. French forces subsequently crushed this kingdom and imposed their will under the League of Nations Mandate.\n\nNow ruled by France from afar, Syria remains restless. Revolts throughout the new mandate have erupted, and anti-French sentiment is at an all time high. As Europe drifts once more toward conflict, the question looms: will Syria remain subservient to France, or will it rise to reclaim the independence that was denied?"
 LEB_GATHERING_STORM_DESC: "Nestled between the Mediterranean coast and the mountains of the Levant, Lebanon was shaped under the French Mandate into a distinct political entity, balancing diverse religious communities through a system of confessionalism designed to preserve fragile stability.\n\nBeirut's bustling ports and mountain villages alike reflect a country defined by trade, faith, and competing identities. Yet as nationalist currents spread and French authority weakens, this delicate arrangement faces growing strain. Will Lebanon's confessional balance endure under the Mandate, or will it be pulled into the wider struggle for independence and unity?"
 ALDR_GATHERING_STORM_DESC: "Located in the mountains of Syria, the regions of Alawite and Jabal al-Druze have long been bastions of distinct communities with deep-rooted traditions. In 1920 and 1921, respectively, the Alawite State and the State of Jabal al-Druze were created as part of the 'Divide and Rule' tactic planned out in the French Mandate for Syria. \n\nYet, the age of these states is drawing to a close, as Syrian nationalists gain strength and momentum. The fate of these mountain states is surrounded in mystery: will they inevitably get incorporated, or will they seize the moment to assert their independence?"